schema: spec-driven

context: |
  Tech stack: Python, matplotlib/silx（交互绘图库）
  结构: interactive_plotting/core.py 为核心模块
  Testing: pytest（tests/）
  风格: 参考 git log，小步提交，每个功能一个 commit
rules:
  specs:
    - 文档相关内容都用简体中文撰写
    - 场景用 WHEN/THEN 格式
  design:
    - 涉及鼠标交互时说明事件处理顺序


